# System Configuration
simulation:
  dt: 0.001                # Control loop timestep [s]
  duration: 60.0           # Max simulation duration [s]
  render: false
  gravity: [0, 0, -9.81]

# Learning from Demonstration
lfd:
  method: gmr              # gmr | dmp
  n_components: 5          # GMM components
  n_demonstrations: 5      # Per phase
  dtw_alignment: true

# Tissue Model
tissue:
  model_type: mass_spring  # mass_spring | fem_linear | fem_corotational
  youngs_modulus: 5000.0   # Pa
  poissons_ratio: 0.45
  density: 1060.0          # kg/m^3
  damping_ratio: 0.3
  thickness: 0.005         # m
  grid_size: [20, 20]
  spring_stiffness: 500.0  # N/m
  damping_coefficient: 5.0 # Ns/m

# Force Control
force_control:
  mode: impedance          # impedance | admittance | hybrid
  default_params:
    mass: [0.5, 0.5, 0.5, 0.05, 0.05, 0.05]
    damping: [10.0, 10.0, 15.0, 1.0, 1.0, 1.0]
    stiffness: [200.0, 200.0, 300.0, 20.0, 20.0, 20.0]
  adaptive: true
  force_filter:
    cutoff_freq: 30.0      # Hz
    sample_rate: 1000.0    # Hz
    window_size: 5

# Visual Servoing
visual_servo:
  mode: pbvs               # ibvs | pbvs | hybrid
  gain: 0.5
  camera:
    fx: 700.0
    fy: 700.0
    cx: 320.0
    cy: 240.0
    baseline: 0.005        # m
    width: 640
    height: 480
  needle_radius: 0.008     # m

# Safety Constraints
safety:
  enabled: true
  force_limits:
    normal: 5.0            # N
    warning: 8.0           # N
    critical: 10.0         # N
    insert_phase: 3.0      # N
  torque_max: 0.5          # Nm
  velocity_limits:
    linear: 0.05           # m/s
    angular: 0.5           # rad/s
    acceleration: 0.2      # m/s^2
  workspace:
    x_range: [-0.1, 0.1]   # m
    y_range: [-0.1, 0.1]   # m
    z_range: [-0.15, 0.0]  # m
    radius: 0.15           # m
  tissue:
    max_strain: 0.25
    max_stress: 50000.0    # Pa
  cbf:
    alpha: 1.0
  watchdog_timeout: 0.1    # s
