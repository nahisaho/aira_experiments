# =============================================================================
# GelSight/DIGIT Tactile Sensing System - Default Configuration
# =============================================================================

system:
  name: "TactileManipulation"
  version: "1.0.0"
  device: "cuda:0"
  seed: 42
  log_dir: "logs/"

# --- Sensor Configuration ---
sensor:
  type: "GelSight"  # GelSight | DIGIT
  resolution: [320, 240]  # Width x Height
  fps: 30
  gel_thickness_mm: 3.0
  elastomer_modulus_kpa: 100.0
  illumination:
    num_leds: 3
    colors: ["red", "green", "blue"]
    angles_deg: [0, 120, 240]

# --- Contact Shape & Force Estimation (Module 1) ---
contact_estimation:
  model: "ContactNet"
  backbone: "resnet18"
  input_channels: 3  # RGB tactile image
  depth_output_size: [64, 64]
  force_components: 6  # Fx, Fy, Fz, Tx, Ty, Tz
  calibration:
    method: "photometric_stereo"
    lookup_table_path: "data/calibration_lut.npy"
    poisson_solver: "dct"
  training:
    lr: 1.0e-4
    batch_size: 32
    epochs: 100
    loss_weights:
      depth: 1.0
      normal: 0.5
      force: 2.0

# --- Texture Classification (Module 2) ---
texture_classification:
  model: "TextureCNN"
  backbone: "efficientnet_b0"
  num_classes: 20
  input_size: [224, 224]
  augmentation:
    rotation: 15
    flip: true
    color_jitter: 0.2
    gaussian_noise_std: 0.01
  training:
    lr: 5.0e-4
    batch_size: 64
    epochs: 80
    scheduler: "cosine"
    label_smoothing: 0.1

# --- Multimodal Fusion (Module 3) ---
multimodal_fusion:
  model: "CrossModalTransformer"
  tactile_encoder: "resnet18"
  visual_encoder: "resnet34"
  fusion_dim: 256
  num_transformer_layers: 4
  num_heads: 8
  dropout: 0.1
  contrastive_loss_weight: 0.3
  training:
    lr: 3.0e-4
    batch_size: 16
    epochs: 120

# --- Grasp Stability (Module 4) ---
grasp_stability:
  model: "GraspStabilityNet"
  input_features: ["contact_area", "force_distribution", "slip_signal", "texture_embedding"]
  temporal_window: 10  # frames
  lstm_hidden: 128
  output: "stability_score"  # 0.0 (unstable) to 1.0 (stable)
  threshold: 0.7
  inference_rate_hz: 30
  training:
    lr: 1.0e-3
    batch_size: 128
    epochs: 60

# --- Slip Detection & Force Control (Module 5) ---
slip_detection:
  model: "SlipDetector"
  method: "optical_flow_cnn"
  optical_flow:
    algorithm: "farneback"
    pyr_scale: 0.5
    levels: 3
    winsize: 15
  slip_threshold: 0.15  # normalized displacement
  force_controller:
    type: "impedance"
    kp: 50.0
    kd: 5.0
    ki: 0.1
    max_force_n: 20.0
    min_force_n: 0.5
    update_rate_hz: 100

# --- Exploratory Grasping (Module 6) ---
exploratory_grasping:
  strategy: "bayesian_exploration"
  prior: "gaussian_process"
  acquisition_function: "expected_improvement"
  safety:
    max_force_n: 10.0
    max_approach_velocity_ms: 0.05
    contact_detection_threshold: 0.1
    emergency_retract_force_n: 15.0
  grasp_candidates: 50
  refinement_steps: 5
  exploration_budget: 20

# --- Isaac Sim Configuration ---
isaac_sim:
  scene:
    gravity: [0, 0, -9.81]
    timestep: 0.001
    render_interval: 4
  robot:
    type: "franka_panda"
    gripper: "parallel_jaw"
    num_tactile_sensors: 2
  tactile_sim:
    gel_mesh_resolution: [64, 64]
    elastomer_model: "neo_hookean"
    contact_stiffness: 1000.0
    friction_coefficient: 0.8
  objects:
    dataset: "ycb"
    num_training_objects: 50
    num_test_objects: 20
  domain_randomization:
    texture: true
    lighting: true
    object_mass_range: [0.01, 2.0]
    friction_range: [0.3, 1.2]
