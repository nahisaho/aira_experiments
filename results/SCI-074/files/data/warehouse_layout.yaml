warehouse:
  name: sample_warehouse_a
  frame_id: map
  dimensions_m:
    length_x: 50.0
    width_y: 30.0
    height_z: 8.0
  usable_height_m: 6.0
  coordinate_origin: southwest_floor_corner
  notes:
    - x increases eastward along aisle length
    - y increases northward across aisles
    - z increases upward from floor level

flight_bounds:
  min:
    x: 0.5
    y: 0.5
    z: 0.4
  max:
    x: 49.5
    y: 29.5
    z: 6.5

cross_aisles:
  front_cross_aisle:
    x_range: [0.0, 4.0]
    y_range: [0.0, 30.0]
  rear_cross_aisle:
    x_range: [46.0, 50.0]
    y_range: [0.0, 30.0]

aisles:
  - id: A1
    centerline_y: 4.0
    width_m: 2.2
    x_start: 4.0
    x_end: 46.0
    scan_direction_primary: eastbound
    hold_waypoints: [A1_ENTRY_HOLD, A1_EXIT_HOLD]
  - id: A2
    centerline_y: 9.0
    width_m: 2.2
    x_start: 4.0
    x_end: 46.0
    scan_direction_primary: westbound
    hold_waypoints: [A2_ENTRY_HOLD, A2_EXIT_HOLD]
  - id: A3
    centerline_y: 14.0
    width_m: 2.2
    x_start: 4.0
    x_end: 46.0
    scan_direction_primary: eastbound
    hold_waypoints: [A3_ENTRY_HOLD, A3_EXIT_HOLD]
  - id: A4
    centerline_y: 19.0
    width_m: 2.2
    x_start: 4.0
    x_end: 46.0
    scan_direction_primary: westbound
    hold_waypoints: [A4_ENTRY_HOLD, A4_EXIT_HOLD]
  - id: A5
    centerline_y: 24.0
    width_m: 2.2
    x_start: 4.0
    x_end: 46.0
    scan_direction_primary: eastbound
    hold_waypoints: [A5_ENTRY_HOLD, A5_EXIT_HOLD]

