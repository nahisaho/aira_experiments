landing_pads:
  - id: PAD_SW
    pose:
      x: 2.0
      y: 1.8
      z: 0.0
      yaw_deg: 0.0
    size_m: [1.5, 1.5]
    type: charging_pad
  - id: PAD_SE
    pose:
      x: 48.0
      y: 1.8
      z: 0.0
      yaw_deg: 180.0
    size_m: [1.5, 1.5]
    type: backup_pad

no_fly_zones:
  - id: PACKING_STATIONS
    type: hard_keep_out
    polygon_xy:
      - [0.0, 26.5]
      - [8.0, 26.5]
      - [8.0, 30.0]
      - [0.0, 30.0]
    z_range: [0.0, 8.0]
  - id: INBOUND_DOCKS
    type: hard_keep_out
    polygon_xy:
      - [46.0, 10.0]
      - [50.0, 10.0]
      - [50.0, 20.0]
      - [46.0, 20.0]
    z_range: [0.0, 8.0]
  - id: HUMAN_WORKCELL
    type: soft_keep_out
    polygon_xy:
      - [0.0, 8.0]
      - [6.0, 8.0]
      - [6.0, 14.0]
      - [0.0, 14.0]
    z_range: [0.0, 3.0]
  - id: FIRE_EXIT_CLEARANCE
    type: hard_keep_out
    polygon_xy:
      - [22.5, 29.0]
      - [27.5, 29.0]
      - [27.5, 30.0]
      - [22.5, 30.0]
    z_range: [0.0, 8.0]

precision_landing_markers:
  - id: MARKER_PAD_SW
    pad_id: PAD_SW
    pose: {x: 2.0, y: 1.8, z: 0.0}
    marker_family: april_tag_36h11
    marker_size_m: 0.20
  - id: MARKER_PAD_SE
    pad_id: PAD_SE
    pose: {x: 48.0, y: 1.8, z: 0.0}
    marker_family: april_tag_36h11
    marker_size_m: 0.20

waypoints:
  - {id: TAKEOFF_SW, x: 2.0, y: 1.8, z: 1.8, yaw_deg: 0.0, type: takeoff}
  - {id: STAGING_FRONT, x: 3.2, y: 15.0, z: 1.8, yaw_deg: 0.0, type: staging}
  - {id: A1_ENTRY_HOLD, x: 4.0, y: 4.0, z: 1.8, yaw_deg: 0.0, type: hold}
  - {id: A1_EXIT_HOLD, x: 46.0, y: 4.0, z: 1.8, yaw_deg: 180.0, type: hold}
  - {id: A2_ENTRY_HOLD, x: 46.0, y: 9.0, z: 1.8, yaw_deg: 180.0, type: hold}
  - {id: A2_EXIT_HOLD, x: 4.0, y: 9.0, z: 1.8, yaw_deg: 0.0, type: hold}
  - {id: A3_ENTRY_HOLD, x: 4.0, y: 14.0, z: 1.8, yaw_deg: 0.0, type: hold}
  - {id: A3_EXIT_HOLD, x: 46.0, y: 14.0, z: 1.8, yaw_deg: 180.0, type: hold}
  - {id: A4_ENTRY_HOLD, x: 46.0, y: 19.0, z: 1.8, yaw_deg: 180.0, type: hold}
  - {id: A4_EXIT_HOLD, x: 4.0, y: 19.0, z: 1.8, yaw_deg: 0.0, type: hold}
  - {id: A5_ENTRY_HOLD, x: 4.0, y: 24.0, z: 1.8, yaw_deg: 0.0, type: hold}
  - {id: A5_EXIT_HOLD, x: 46.0, y: 24.0, z: 1.8, yaw_deg: 180.0, type: hold}
  - {id: RETURN_STAGING, x: 3.2, y: 15.0, z: 1.8, yaw_deg: 180.0, type: staging}
  - {id: LAND_SW, x: 2.0, y: 1.8, z: 0.3, yaw_deg: 0.0, type: landing}

scan_waypoint_templates:
  bay_pitch_m: 2.4
  dwell_s: 1.2
  tiers:
    - {name: T1, z_m: 1.5}
    - {name: T2, z_m: 3.0}
    - {name: T3, z_m: 4.5}
    - {name: T4, z_m: 6.0}
  pass_rules:
    - aisle_id: A1
      rows: [S1_SOUTH, S1_NORTH]
      order: [T1, T2, T3, T4]
    - aisle_id: A2
      rows: [S2_SOUTH, S2_NORTH]
      order: [T1, T2, T3, T4]
    - aisle_id: A3
      rows: [S3_SOUTH, S3_NORTH]
      order: [T1, T2, T3, T4]
    - aisle_id: A4
      rows: [S4_SOUTH, S4_NORTH]
      order: [T1, T2, T3, T4]
    - aisle_id: A5
      rows: [S5_SOUTH, S5_NORTH]
      order: [T1, T2, T3, T4]

emergency_hovers:
  - {id: EH_A1_FRONT, x: 4.5, y: 4.0, z: 2.5}
  - {id: EH_A1_REAR, x: 45.5, y: 4.0, z: 2.5}
  - {id: EH_A3_FRONT, x: 4.5, y: 14.0, z: 2.5}
  - {id: EH_A3_REAR, x: 45.5, y: 14.0, z: 2.5}
  - {id: EH_A5_FRONT, x: 4.5, y: 24.0, z: 2.5}
  - {id: EH_A5_REAR, x: 45.5, y: 24.0, z: 2.5}
