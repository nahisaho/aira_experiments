<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">
    3-Tier Safety Zone Architecture
  </text>

  <!-- Monitoring zone (15m) -->
  <ellipse cx="350" cy="280" rx="300" ry="200" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>
  <text x="620" y="140" font-size="11" font-weight="bold" fill="#1565C0">Monitoring Zone</text>
  <text x="620" y="156" font-size="10" fill="#1565C0">5-15m: Track only</text>

  <!-- Avoidance zone (5m) -->
  <ellipse cx="350" cy="280" rx="150" ry="100" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2"/>
  <text x="460" y="210" font-size="11" font-weight="bold" fill="#E65100">Avoidance Zone</text>
  <text x="460" y="226" font-size="10" fill="#E65100">1.5-5m: Replan</text>

  <!-- Emergency zone (1.5m) -->
  <ellipse cx="350" cy="280" rx="55" ry="37" fill="#FFCDD2" stroke="#EF5350" stroke-width="2"/>
  <text x="350" y="276" text-anchor="middle" font-size="9" font-weight="bold" fill="#C62828">Emergency</text>
  <text x="350" y="290" text-anchor="middle" font-size="8" fill="#C62828">0-1.5m: STOP</text>

  <!-- Drone icon -->
  <text x="350" y="265" text-anchor="middle" font-size="20">🛸</text>

  <!-- Dynamic obstacles -->
  <text x="230" y="250" font-size="16">🚶</text>
  <text x="233" y="265" font-size="8" fill="#333">Worker</text>

  <text x="150" y="310" font-size="16">🚜</text>
  <text x="150" y="326" font-size="8" fill="#333">Forklift</text>

  <text x="500" y="340" font-size="14">📦</text>
  <text x="497" y="356" font-size="8" fill="#333">Pallet</text>

  <!-- Response actions -->
  <rect x="30" y="420" width="190" height="60" rx="6" fill="#FFCDD2" stroke="#EF5350"/>
  <text x="125" y="442" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Emergency (0-1.5m)</text>
  <text x="125" y="458" text-anchor="middle" font-size="9" fill="#333">Immediate velocity zero</text>
  <text x="125" y="472" text-anchor="middle" font-size="9" fill="#333">Hover or controlled retreat</text>

  <rect x="250" y="420" width="190" height="60" rx="6" fill="#FFF3E0" stroke="#FFB74D"/>
  <text x="345" y="442" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">Avoidance (1.5-5m)</text>
  <text x="345" y="458" text-anchor="middle" font-size="9" fill="#333">Active path replanning</text>
  <text x="345" y="472" text-anchor="middle" font-size="9" fill="#333">Velocity reduction to 0.5 m/s</text>

  <rect x="470" y="420" width="200" height="60" rx="6" fill="#E3F2FD" stroke="#90CAF9"/>
  <text x="570" y="442" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Monitoring (5-15m)</text>
  <text x="570" y="458" text-anchor="middle" font-size="9" fill="#333">Track and predict trajectory</text>
  <text x="570" y="472" text-anchor="middle" font-size="9" fill="#333">No speed reduction needed</text>
</svg>