# =============================================================================
# Cancer Proteogenomics Integrated Analysis Pipeline — Configuration
# =============================================================================
# Target: CPTAC Pancreatic Cancer (PDAC) cohort
# Pipeline: MaxQuant → Perseus → R/Bioconductor
# Version: 1.0.0
# Date: 2026-05-23
# =============================================================================

project:
  name: "CPTAC-PDAC-Proteogenomics"
  organism: "Homo sapiens"
  genome_build: "GRCh38"
  proteome: "UniProt_Human_2024_01"
  output_dir: "results/"

# ---------------------------------------------------------------------------
# Module 1: Variant Peptide Search
# ---------------------------------------------------------------------------
variant_peptide:
  vcf_input: "data/somatic_variants.vcf"
  rna_bam: "data/rnaseq_alignments/"
  customdb_tool: "customProDB"       # R/Bioconductor
  search_engine: "MaxQuant"
  fdr_threshold: 0.01
  min_peptide_length: 8
  max_peptide_length: 25
  max_missed_cleavages: 2
  # Variant types to include
  variant_types:
    - missense
    - frameshift
    - splice_junction
    - gene_fusion
  # COSMIC filtering
  cosmic_filter: true
  cosmic_version: "v99"

# ---------------------------------------------------------------------------
# Module 2: RNA–Protein Discordance (Translational Control)
# ---------------------------------------------------------------------------
rna_protein_discordance:
  rnaseq_counts: "data/rnaseq_tpm.tsv"
  protein_intensities: "data/proteinGroups.txt"  # MaxQuant output
  normalization: "median_centering"
  correlation_method: "spearman"
  discordance_threshold: 1.5      # |log2 ratio| cutoff
  min_samples_detected: 10        # minimum samples with both RNA & protein
  pathway_db: "Reactome"
  gene_set_size_range: [15, 500]
  # Translational efficiency estimation
  te_method: "regression_residual"  # RNA~Protein residuals
  covariate_correction:
    - copy_number
    - methylation

# ---------------------------------------------------------------------------
# Module 3: Phosphoproteomics & Kinase Activity
# ---------------------------------------------------------------------------
phosphoproteomics:
  phospho_sites: "data/phospho_STY_sites.txt"  # MaxQuant Phospho(STY)Sites
  localization_prob: 0.75           # Class I sites
  normalization: "protein_level"    # normalize to total protein
  imputation: "MinProb"            # Perseus-style left-censored
  kinase_activity:
    tool: "KinaseActivityScoring"   # KSEA / KEA3 / PhosR
    substrates_db: "PhosphoSitePlus"
    min_substrates: 3
    fdr_correction: "BH"
  differential:
    contrast: "Tumor_vs_Normal"
    test: "limma_moderated_t"
    adj_p_cutoff: 0.05
    log2fc_cutoff: 1.0

# ---------------------------------------------------------------------------
# Module 4: Neoantigen Proteomics Verification
# ---------------------------------------------------------------------------
neoantigen:
  hla_typing: "data/hla_types.tsv"   # OptiType or HLA-HD output
  binding_predictor: "NetMHCpan-4.1"
  binding_affinity_cutoff: 500       # nM
  percentile_rank_cutoff: 2.0
  expression_filter:
    rna_tpm_min: 1.0
    protein_detected: true           # must be in variant peptide DB hits
  immunogenicity:
    tool: "PRIME"                    # or DeepImmuno
    score_cutoff: 0.5
  output: "results/neoantigen_candidates.tsv"

# ---------------------------------------------------------------------------
# Module 5: MOFA+ Multi-Omics Factor Analysis
# ---------------------------------------------------------------------------
mofa_plus:
  views:
    - name: "mRNA"
      file: "data/rnaseq_tpm.tsv"
      features: 5000                 # top variable features
    - name: "Proteome"
      file: "data/proteinGroups.txt"
      features: 5000
    - name: "Phosphoproteome"
      file: "data/phospho_STY_sites.txt"
      features: 3000
    - name: "CNA"
      file: "data/copy_number.tsv"
      features: "all"
  groups: "data/clinical_metadata.tsv"   # patient subtypes
  n_factors: 15
  convergence_mode: "slow"
  drop_factor_threshold: 0.01
  seed: 42
  gpu: false
  output_model: "results/mofa_model.hdf5"

# ---------------------------------------------------------------------------
# Module 6: CPTAC PDAC Case Study
# ---------------------------------------------------------------------------
cptac_pdac:
  data_source: "https://cptac-data-portal.georgetown.edu/"
  cohort: "Pancreatic_Ductal_Adenocarcinoma"
  n_tumor: 140
  n_normal: 67
  clinical_endpoints:
    - overall_survival
    - progression_free_survival
    - tumor_grade
    - molecular_subtype       # basal-like vs classical
  subtype_markers:
    basal: ["KRT5", "KRT17", "S100A2", "TP63"]
    classical: ["GATA6", "HNF1A", "TFF1", "AGR2"]

# ---------------------------------------------------------------------------
# Computational Environment
# ---------------------------------------------------------------------------
environment:
  maxquant_version: "2.4.13.0"
  perseus_version: "2.1.2.0"
  r_version: "4.3.2"
  bioconductor_version: "3.18"
  python_version: "3.11"
  r_packages:
    - customProDB
    - maftools
    - DESeq2
    - limma
    - PhosR
    - MOFA2
    - survival
    - survminer
    - ComplexHeatmap
    - ggplot2
    - clusterProfiler
  python_packages:
    - mofapy2
    - pyteomics
    - netMHCpan (external)
  threads: 16
  memory_gb: 64
