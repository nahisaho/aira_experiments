# Configuration for dual-backend 3D mapping: VDBFusion primary, Octomap fallback.
# Values are tuned for Intel RealSense D455 depth input and VIO-driven pose updates.

mapping:
  world_frame: "map"
  body_frame: "base_link"
  odometry_topic: "/vio/odometry"
  pointcloud_topic: "/camera/depth/color/points"
  depth_frame_rate_hz: 30.0
  max_pose_age_ms: 80.0
  enable_submapping: true
  submap_trigger_translation_m: 20.0
  submap_trigger_rotation_deg: 90.0
  serialization_directory: "results/maps"
  shared_map_index_path: "results/maps/map_index.yaml"

preprocessing:
  voxel_downsample_m: 0.03
  crop_min_m: [ -8.0, -8.0, -2.0 ]
  crop_max_m: [  8.0,  8.0,  4.0 ]
  range_min_m: 0.30
  range_max_m: 8.00
  range_max_inspection_m: 4.00
  use_statistical_outlier_filter: true
  sor_mean_k: 12
  sor_stddev: 1.5
  use_temporal_filter: false
  deskew_with_vio: true
  pose_covariance_weighting: true

vdbfusion:
  enabled: true
  voxel_size_navigation_m: 0.05
  voxel_size_inspection_m: 0.01
  truncation_distance_navigation_m: 0.20
  truncation_distance_inspection_m: 0.06
  max_weight: 100.0
  update_rate_hz: 30.0
  local_map_radius_m: 15.0
  active_tile_radius_m: 20.0
  inactive_tile_compress_after_s: 15.0
  tile_lru_cache_size: 512
  enable_gpu_fusion: true
  enable_gpu_raycast: true
  publish_esdf_slice: true
  esdf_slice_height_m: 0.5
  esdf_slice_thickness_m: 1.0
  confidence_weighting:
    enabled: true
    alpha_range: 0.08
    reference_range_m: 2.0
    incidence_gamma: 2.0
    min_pose_weight: 0.25
    max_pose_weight: 1.0
  roi_inspection:
    enabled: true
    max_roi_extent_m: [4.0, 4.0, 3.0]
    auto_enable_distance_m: 1.5
    save_highres_submaps: true
  serialization:
    save_period_s: 10.0
    save_on_disarm: true
    file_prefix: "vdb_submap"
    metadata_format: "yaml"

octomap:
  enabled: true
  use_as_fallback: true
  resolution_realtime_m: 0.10
  resolution_detailed_m: 0.05
  prob_hit: 0.70
  prob_miss: 0.40
  clamping_thres_min: 0.12
  clamping_thres_max: 0.97
  occupancy_thres: 0.50
  max_range_m: 8.0
  raycast_max_range_m: 10.0
  clear_free_space: true
  update_rate_hz: 20.0
  serialization:
    save_period_s: 15.0
    save_on_disarm: true
    file_prefix: "octomap_submap"
    format: "bt"

backend_switching:
  allow_runtime_switch: true
  fallback_on_gpu_overload: true
  gpu_overload_threshold_pct: 85.0
  fallback_on_mapping_latency_ms: 50.0
  fallback_on_vio_degraded: true
  recover_to_vdb_after_stable_s: 5.0

planning_exports:
  publish_occupied_cloud: true
  publish_local_2d_costmap_slice: true
  costmap_slice_height_m: 0.3
  inflation_radius_m: 0.35
  obstacle_confidence_threshold: 0.60

map_sharing:
  enable_cross_flight_reuse: true
  require_calibration_hash: true
  stale_region_timeout_h: 24.0
  conflict_vote_count: 3
  global_catalog_max_submaps: 200
