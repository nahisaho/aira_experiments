<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">
    Pipelined Processing Budget — Jetson Orin NX (per-frame, 30fps target)
  </text>

  <!-- Axis labels -->
  <text x="100" y="65" text-anchor="end" font-size="11" font-weight="bold" fill="#333">Module</text>
  <text x="500" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Time (ms) →</text>

  <!-- Time axis -->
  <line x1="110" y1="70" x2="950" y2="70" stroke="#ccc" stroke-width="1"/>
  <line x1="110" y1="70" x2="110" y2="450" stroke="#ccc" stroke-width="1"/>

  <!-- Time ticks every 5ms -->
  <text x="110" y="82" text-anchor="middle" font-size="9" fill="#666">0</text>
  <text x="210" y="82" text-anchor="middle" font-size="9" fill="#666">5</text>
  <text x="310" y="82" text-anchor="middle" font-size="9" fill="#666">10</text>
  <text x="410" y="82" text-anchor="middle" font-size="9" fill="#666">15</text>
  <text x="510" y="82" text-anchor="middle" font-size="9" fill="#666">20</text>
  <text x="610" y="82" text-anchor="middle" font-size="9" fill="#666">25</text>
  <text x="710" y="82" text-anchor="middle" font-size="9" fill="#666">30</text>
  <text x="810" y="82" text-anchor="middle" font-size="9" fill="#666">35</text>
  <text x="910" y="82" text-anchor="middle" font-size="9" fill="#666">40</text>

  <!-- Grid lines -->
  <line x1="210" y1="70" x2="210" y2="450" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="70" x2="310" y2="450" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="410" y1="70" x2="410" y2="450" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="510" y1="70" x2="510" y2="450" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="610" y1="70" x2="610" y2="450" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="710" y1="70" x2="710" y2="450" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="810" y1="70" x2="810" y2="450" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="910" y1="70" x2="910" y2="450" stroke="#eee" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- CPU track -->
  <text x="50" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">CPU</text>

  <!-- Image capture - CPU 2.5ms -->
  <rect x="110" y="90" width="50" height="25" rx="3" fill="#42A5F5" opacity="0.9"/>
  <text x="135" y="107" text-anchor="middle" font-size="8" fill="white">Capture</text>

  <!-- VIO optimization - CPU 6.5ms, starts after feature extraction -->
  <rect x="296" y="90" width="130" height="25" rx="3" fill="#1565C0" opacity="0.9"/>
  <text x="361" y="107" text-anchor="middle" font-size="8" fill="white">VIO Optim (6.5ms)</text>

  <!-- ByteTrack - CPU 1.2ms -->
  <rect x="474" y="90" width="24" height="25" rx="3" fill="#0D47A1" opacity="0.9"/>
  <text x="486" y="107" text-anchor="middle" font-size="7" fill="white">BT</text>

  <!-- Path planning - CPU 2ms -->
  <rect x="780" y="90" width="40" height="25" rx="3" fill="#1A237E" opacity="0.9"/>
  <text x="800" y="107" text-anchor="middle" font-size="8" fill="white">Plan</text>

  <!-- GPU track -->
  <text x="50" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">GPU</text>

  <!-- SuperPoint - GPU 4.8ms -->
  <rect x="160" y="135" width="96" height="25" rx="3" fill="#FF9800" opacity="0.9"/>
  <text x="208" y="152" text-anchor="middle" font-size="8" fill="white">SuperPoint (4.8ms)</text>

  <!-- Depth processing - GPU 6ms -->
  <rect x="256" y="135" width="120" height="25" rx="3" fill="#F57C00" opacity="0.9"/>
  <text x="316" y="152" text-anchor="middle" font-size="8" fill="white">Depth Proc (6ms)</text>

  <!-- Trajectory prediction - GPU 2.7ms -->
  <rect x="498" y="135" width="54" height="25" rx="3" fill="#EF6C00" opacity="0.9"/>
  <text x="525" y="152" text-anchor="middle" font-size="8" fill="white">Pred</text>

  <!-- VDBFusion - GPU 4.5ms -->
  <rect x="552" y="135" width="90" height="25" rx="3" fill="#E65100" opacity="0.9"/>
  <text x="597" y="152" text-anchor="middle" font-size="8" fill="white">VDBFusion (4.5ms)</text>

  <!-- ESDF - GPU 3.6ms -->
  <rect x="642" y="135" width="72" height="25" rx="3" fill="#BF360C" opacity="0.9"/>
  <text x="678" y="152" text-anchor="middle" font-size="8" fill="white">ESDF (3.6ms)</text>

  <!-- DLA track -->
  <text x="50" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">DLA</text>

  <!-- YOLOv8n - DLA 11.5ms -->
  <rect x="160" y="180" width="230" height="25" rx="3" fill="#4CAF50" opacity="0.9"/>
  <text x="275" y="197" text-anchor="middle" font-size="8" fill="white">YOLOv8n Detection (11.5ms)</text>

  <!-- SuperPoint DLA fallback -->
  <rect x="390" y="180" width="84" height="25" rx="3" fill="#388E3C" opacity="0.9"/>
  <text x="432" y="197" text-anchor="middle" font-size="8" fill="white">SP-DLA (4.2ms)</text>

  <!-- Critical path -->
  <line x1="110" y1="235" x2="820" y2="235" stroke="#F44336" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arr)"/>
  <text x="465" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#F44336">Critical Path: ~41-46ms (Capture → Control Command)</text>

  <!-- Legend -->
  <rect x="110" y="270" width="840" height="90" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="530" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Performance Summary</text>

  <rect x="130" y="305" width="15" height="12" fill="#42A5F5"/>
  <text x="150" y="315" font-size="10" fill="#333">CPU: 12.2ms total</text>

  <rect x="300" y="305" width="15" height="12" fill="#FF9800"/>
  <text x="320" y="315" font-size="10" fill="#333">GPU: 23.4ms total</text>

  <rect x="470" y="305" width="15" height="12" fill="#4CAF50"/>
  <text x="490" y="315" font-size="10" fill="#333">DLA: 15.7ms total</text>

  <rect x="640" y="305" width="15" height="12" fill="none" stroke="#F44336" stroke-width="2"/>
  <text x="660" y="315" font-size="10" fill="#333">Throughput: 24-30 fps</text>

  <text x="530" y="345" text-anchor="middle" font-size="10" fill="#555">
    Pipelined execution overlaps CPU/GPU/DLA across frames | Peak RSS: 9.3 GB / 16 GB | Power: 15-20W
  </text>

  <!-- Frame boundary indicators -->
  <rect x="110" y="380" width="840" height="100" rx="6" fill="#E8EAF6" stroke="#C5CAE9"/>
  <text x="530" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#283593">Warehouse Scanning KPIs</text>

  <text x="200" y="425" text-anchor="middle" font-size="10" fill="#333">Scan Rate</text>
  <text x="200" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">~200</text>
  <text x="200" y="465" text-anchor="middle" font-size="9" fill="#666">items/min</text>

  <text x="370" y="425" text-anchor="middle" font-size="10" fill="#333">Full Warehouse</text>
  <text x="370" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E7D32">~25</text>
  <text x="370" y="465" text-anchor="middle" font-size="9" fill="#666">minutes</text>

  <text x="530" y="425" text-anchor="middle" font-size="10" fill="#333">Position Acc.</text>
  <text x="530" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#E65100">±10</text>
  <text x="530" y="465" text-anchor="middle" font-size="9" fill="#666">cm</text>

  <text x="690" y="425" text-anchor="middle" font-size="10" fill="#333">Barcode Success</text>
  <text x="690" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#7B1FA2">&gt;98%</text>
  <text x="690" y="465" text-anchor="middle" font-size="9" fill="#666">per flyover</text>

  <text x="850" y="425" text-anchor="middle" font-size="10" fill="#333">Flight Segment</text>
  <text x="850" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#C62828">15</text>
  <text x="850" y="465" text-anchor="middle" font-size="9" fill="#666">min (30% RTH)</text>
</svg>