<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <rect width="1280" height="420" fill="#ffffff"/>
  <style>
    .box { fill:#e0f2fe; stroke:#0369a1; stroke-width:2; rx:14; ry:14; }
    .box2 { fill:#ede9fe; stroke:#6d28d9; stroke-width:2; rx:14; ry:14; }
    .box3 { fill:#fef2f2; stroke:#b91c1c; stroke-width:2; rx:14; ry:14; }
    .txt { font: 20px Arial, sans-serif; fill:#111827; }
    .small { font: 16px Arial, sans-serif; fill:#111827; }
    .arrow { stroke:#374151; stroke-width:3; marker-end:url(#m); }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="40" y="45" class="txt">3D Mapping Architecture</text>
  <rect x="40" y="150" width="220" height="90" class="box"/>
  <text x="92" y="188" class="txt">D455 Point Cloud</text>
  <text x="70" y="216" class="small">Depth Filtering + Cropping</text>
  <rect x="320" y="70" width="220" height="90" class="box2"/>
  <text x="380" y="108" class="txt">VIO Pose</text>
  <text x="350" y="136" class="small">Time-Aligned Transform</text>
  <rect x="320" y="230" width="220" height="90" class="box2"/>
  <text x="360" y="268" class="txt">Submap Manager</text>
  <text x="356" y="296" class="small">Serialization + Reuse</text>
  <rect x="620" y="70" width="240" height="90" class="box"/>
  <text x="676" y="108" class="txt">VDBFusion</text>
  <text x="650" y="136" class="small">TSDF / ESDF / Raycast</text>
  <rect x="620" y="230" width="240" height="90" class="box3"/>
  <text x="692" y="268" class="txt">Octomap</text>
  <text x="660" y="296" class="small">Fallback Occupancy Map</text>
  <rect x="940" y="70" width="260" height="90" class="box2"/>
  <text x="1008" y="108" class="txt">Planner</text>
  <text x="980" y="136" class="small">Local Collision Constraints</text>
  <rect x="940" y="230" width="260" height="90" class="box2"/>
  <text x="996" y="268" class="txt">Map Store</text>
  <text x="978" y="296" class="small">Cross-Flight Sharing</text>
  <line x1="260" y1="195" x2="320" y2="115" class="arrow"/>
  <line x1="260" y1="195" x2="320" y2="275" class="arrow"/>
  <line x1="540" y1="115" x2="620" y2="115" class="arrow"/>
  <line x1="540" y1="275" x2="620" y2="275" class="arrow"/>
  <line x1="860" y1="115" x2="940" y2="115" class="arrow"/>
  <line x1="860" y1="275" x2="940" y2="275" class="arrow"/>
</svg>
