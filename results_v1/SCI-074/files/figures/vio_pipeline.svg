  <text x="955" y="286" class="small">External Vision Odometry</text>
  <line x1="220" y1="135" x2="290" y2="135" class="arrow"/>
  <line x1="220" y1="285" x2="290" y2="285" class="arrow"/>
  <line x1="510" y1="135" x2="600" y2="190" class="arrow"/>
  <line x1="510" y1="285" x2="600" y2="230" class="arrow"/>
  <line x1="840" y1="190" x2="930" y2="125" class="arrow"/>
