  <text x="72" y="125" class="txt">Stereo Cameras</text>
  <text x="70" y="152" class="small">SuperPoint / ORB</text>
  <rect x="40" y="240" width="180" height="90" class="box"/>
  <text x="92" y="275" class="txt">BMI088 IMU</text>
  <text x="70" y="302" class="small">400 Hz Preintegration</text>
  <rect x="290" y="90" width="220" height="90" class="box2"/>
  <text x="336" y="125" class="txt">Visual Frontend</text>
  <text x="325" y="152" class="small">KLT Tracking + RANSAC</text>
  <rect x="290" y="240" width="220" height="90" class="box2"/>
